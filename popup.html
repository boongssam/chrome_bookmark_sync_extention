<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 16px; font: 13px/1.5 system-ui, "Malgun Gothic", sans-serif; color: #202124; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #dadce0; border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 6px; margin-top: 12px; }
  button { flex: 1; padding: 7px; border: 1px solid #dadce0; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  #status { margin-top: 12px; padding: 8px; border-radius: 6px; background: #f1f3f4; white-space: pre-wrap; }
  #status.err { background: #fce8e6; color: #a50e0e; }
  .hint { color: #5f6368; font-size: 12px; margin-top: 8px; }
  details { margin-top: 10px; }
</style>
</head>
<body>
  <h1>🔄 북마크 동기화</h1>
  <label for="url">웹 앱 URL</label>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="token">토큰</label>
  <input id="token" type="password" placeholder="setup() 실행 로그의 토큰">
  <div class="row">
    <button id="save">저장</button>
    <button id="sync" class="primary">지금 동기화</button>
  </div>
  <div id="status">불러오는 중…</div>
  <p class="hint"><b>북마크바 전체</b>가 동기화됩니다. (기타 북마크·모바일 북마크는 제외)</p>
  <details>
    <summary>문제가 생겼을 때</summary>
    <div class="row">
      <button id="force">강제 동기화</button>
      <button id="reset">기록 초기화</button>
    </div>
    <p class="hint">강제 동기화: 대량 삭제 안전장치를 건너뜁니다.<br>기록 초기화: 다음 동기화를 "처음"처럼 합치기(삭제 없이 합집합)로 진행합니다.</p>
  </details>
  <script src="popup.js"></script>
</body>
</html>
